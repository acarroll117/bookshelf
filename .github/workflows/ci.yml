name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Install test dependencies
        run: cd tests && npm install

      - name: Install Playwright browsers
        run: cd tests && npx playwright install chromium --with-deps

      - name: Write test environment file
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost/bookshelf_test" > tests/.env.test

      - name: Run tests
        run: cd tests && npx playwright test
        env:
          CI: true

      - name: Build frontend
        run: cd frontend && npm run build
